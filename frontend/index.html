<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="NOCTURNE 夜之馆 — 私人影像档案馆" />
    <title>NOCTURNE · 夜之馆</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="shortcut icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS 独立运行（添加到主屏后全屏、状态栏透明） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="夜之馆" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://img.raylxpj.us.ci" crossorigin />
    <link rel="dns-prefetch" href="https://img.raylxpj.us.ci" />
    <style>
      html, body { background: #000; margin: 0; padding: 0; }
      body { color: #fff; -webkit-text-size-adjust: 100%; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #000; transition: opacity .45s ease; }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .boot-mark { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: boot-breathe 2.4s ease-in-out infinite; }
      #boot .boot-ring { width: 68px; height: 68px; border-radius: 50%; border: 1px solid rgba(201,169,106,.55); display: grid; place-items: center; }
      #boot .boot-n { font-family: Didot, "Bodoni 72", Georgia, "Times New Roman", serif; font-size: 34px; line-height: 1; color: #c9a96a; }
      #boot .boot-word { font-family: Didot, "Bodoni 72", Georgia, "Times New Roman", serif; font-size: 12px; letter-spacing: .42em; color: rgba(201,169,106,.85); text-indent: .42em; }
      #boot .boot-sub { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 10px; letter-spacing: .32em; color: rgba(235,235,245,.4); text-indent: .32em; }
      @keyframes boot-breathe { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-mark { animation: none; } }
    </style>
<!-- 首屏并发预取：与 JS 包同时发出列表请求，返回后立刻 preload 前几张缩略图，
         把「等 JS 跑完才发请求」的串行等待压掉。失败静默，不影响正常渲染。 -->
    <script>
      (function () {
        function previewKey(path) {
          var key = String(path || '').replace(/^\/+/, '');
          var dot = key.lastIndexOf('.');
          if (dot <= 0) return key;
          var ext = key.slice(dot + 1);
          if (!/^(jpe?g|png|webp|gif|bmp)$/i.test(ext)) return key;
          var stem = key.slice(0, dot);
          return (/_preview$/.test(stem) ? stem : stem + '_preview') + '.' + ext;
        }
        function keyFromUrl(url) {
          if (!url) return '';
          try {
            var u = new URL(url, location.origin);
            if (u.hostname === 'gdufbbs.dpdns.org' || u.hostname === 'img.raylxpj.us.ci') return previewKey(u.pathname);
            return '';
          } catch (e) { return ''; }
        }
        function preloadThumbs(records) {
          var n = 0;
          for (var i = 0; i < records.length && n < 6; i++) {
            var key = keyFromUrl(records[i].url || records[i].previewUrl);
            if (!key) continue;
            // 与网格实际取的档位对齐：手机 4 列大约 240px，桌面 360px，避免预取了另一档再下一遍
            var stem = key.replace(/\.[^.\/]+$/, '');
            var build = function (w, media) {
              var link = document.createElement('link');
              link.rel = 'preload';
              link.as = 'image';
              if (media) link.media = media;
              link.href = 'https://img.raylxpj.us.ci/' + stem + '_w' + w + '.jpg';
              document.head.appendChild(link);
            };
            build(240, '(max-width: 820px)');
            build(360, '(min-width: 821px)');
            n++;
          }
        }
        try {
          var pending = fetch('/api/picture/list/page/vo', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ current: 1, pageSize: 20, sortField: 'createTime', sortOrder: 'descend' })
          }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (text) {
            if (!text) return null;
            try {
              var safe = text
                .replace(/("(?:id|userId|spaceId|pictureId|taskId|picId|ownerId|createBy|updateBy)"\s*:\s*)(-?\d{16,})(?=\s*[,}])/g, '$1"$2"')
                .replace(/"data"(\s*):(\s*)(-?\d{16,})(?=\s*[,}])/g, '"data"$1:$2"$3"');
              var payload = JSON.parse(safe);
              if (!payload || payload.code !== 0 || !payload.data) return null;
              preloadThumbs(payload.data.records || []);
              return payload.data;
            } catch (e) { return null; }
          }).catch(function () { return null; });
          window.__APIC_LIST_PREFETCH = pending;
        } catch (e) { /* 预取失败就走正常流程 */ }
      })();
    </script>

  <body>

      <div class="boot-mark">
        <div class="boot-ring"><span class="boot-n">N</span></div>
