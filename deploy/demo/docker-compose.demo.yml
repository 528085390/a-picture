# 演示实例专用编排：与生产实例完全隔离（独立容器名 / 卷 / 库 / 桶 / 端口）
# 用法：cp .env.demo.example .env && docker compose -f docker-compose.demo.yml up -d
name: a-picture-demo

services:
  mysql:
    image: mysql:8.0
    container_name: a-picture-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: a_picture
      MYSQL_USER: apicture
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - appnet

  redis:
    image: redis:8-alpine
    container_name: a-picture-demo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - appnet

  backend:
    image: a-picture-backend:latest
    container_name: a-picture-demo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/a_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: apicture
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "1"
      COS_HOST: ${COS_HOST:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:-}
      COS_REGION: ${COS_REGION:-}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      ALIYUN_AI_API_KEY: ${ALIYUN_AI_API_KEY:-}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai -Xms128m -Xmx512m"
      TZ: Asia/Shanghai
    networks:
      - appnet

  web:
    image: a-picture-web:latest
    container_name: a-picture-demo-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8880}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - img-cache:/var/cache/nginx
    networks:
      - appnet

volumes:
  mysql-data:
  redis-data:
  img-cache:

networks:
  appnet:
    driver: bridge
